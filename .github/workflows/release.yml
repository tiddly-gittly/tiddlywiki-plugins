name: Release Plugins

on:
  push:
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'README.md'
      - 'wiki/**'
      - 'public/**'
      - 'scripts/**'
      - '.vscode'
      - '.idea'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - 'wiki/**'
      - 'public/**'
      - '.scripts/**'
      - '.vscode'
      - '.idea'

concurrency:
  group: release-ci-group
  cancel-in-progress: true

jobs:
  Plugins:
    permissions:
        contents: write
        pages: write
        id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Pin major: `latest` jumped to pnpm 11 and breaks install with ERR_PNPM_IGNORED_BUILDS
          # unless allowBuilds is configured. Keep a stable release path.
          version: 10
          run_install: false

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test

      - name: Build Plugins
        run: pnpm run build

      - name: Normalize plugin artifact names
        # tiddlywiki-plugin-dev emits `$__plugins_*.json`; CPL / download URLs use `__plugins_*.json`.
        run: |
          cd dist
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('$__plugins_*.json'):
              path.rename(path.name.removeprefix('$'))
          for path in sorted(Path('.').glob('*.json')):
              print(path.name)
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
